<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>デジタルサイネージ裸眼３Dシミュレーション</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 3Dビューポートを主役に、操作バーと短い解説をその下に積む */
:root{
  --bg:#eceef1; --surface:#ffffff; --fg:#1d2026; --muted:#5d6370; --line:#d5d9e0;
  --accent:#c96f1c; --accent-ink:#ffffff; --led:#6f6cb4; --good:#2f8f5b; --warn:#b7791f; --bad:#c2410c;
  --stage:#15171c;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --surface:#1a1d23; --fg:#e7e9ee; --muted:#9aa1ae; --line:#2b3039;
  --accent:#e8913f; --accent-ink:#1a1206; --led:#9b98e0; --good:#5cc48a; --warn:#e0a84a; --bad:#f07a4a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1a1d23; --fg:#e7e9ee; --muted:#9aa1ae; --line:#2b3039;
  --accent:#e8913f; --accent-ink:#1a1206; --led:#9b98e0; --good:#5cc48a; --warn:#e0a84a; --bad:#f07a4a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3.2vw,30px);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:.01em}
.spec{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.spec b{color:var(--accent);font-weight:600}
.stage{position:relative;width:100%;height:clamp(380px,60vw,700px);background:var(--stage);border-radius:10px;overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:calc(100% - 24px)}
.chip{display:inline-flex;align-items:center;gap:8px;background:rgba(14,16,20,.78);color:#eef0f4;border:1px solid rgba(255,255,255,.12);
  border-radius:999px;padding:5px 12px 5px 10px;font-size:13px;font-weight:500;width:max-content;max-width:100%}
.dot{width:9px;height:9px;border-radius:50%;background:#888;flex:none}
.chip .num{font-family:var(--f-mono);font-size:12px;color:#b9bfca;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:#b9bfca;background:rgba(14,16,20,.6);border-radius:6px;padding:3px 9px;width:max-content;max-width:100%}
.insetlabel{position:absolute;right:14px;font-size:11px;color:#d7dbe3;background:rgba(14,16,20,.75);padding:2px 8px;border-radius:4px;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start}
.group{display:flex;flex-direction:column;gap:6px;min-width:0}
.glabel{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.toggle{font:inherit;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  border-radius:6px;padding:6px 12px;cursor:pointer;line-height:1.3}
.seg button:hover,.toggle:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"],.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible,.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px 28px;border-top:1px solid var(--line);padding-top:16px}
.notes div{min-width:0}
.notes h2{font-size:14px;font-weight:700;margin:0 0 4px;font-family:var(--f-display)}
.notes p{margin:0;color:var(--muted);font-size:13.5px}
.notes p b{color:var(--fg);font-weight:700}
.foot{font-size:12px;color:var(--muted)}
.dims{border:1px solid var(--line);border-radius:8px;padding:12px 14px 14px;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;align-items:end;min-width:0}
.dims legend{padding:0 6px}
.dims label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.dims input{font:inherit;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
.dims input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.dims input:invalid{border-color:var(--bad)}
.src{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.srcrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.filebtn{font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:7px 14px;cursor:pointer;line-height:1.3}
.filebtn:hover{filter:brightness(1.08)}
.dims .filebtn{display:inline-block;color:var(--accent-ink);font-size:13px}
#srcFile:focus-visible ~ .seg{outline:2px solid var(--accent);outline-offset:2px}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.srcinfo{margin:0;font-size:12.5px;color:var(--muted);line-height:1.6}
.srcinfo b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.poshint{grid-column:1/-1}
.stage.dragover{outline:3px dashed var(--accent);outline-offset:-6px}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>デジタルサイネージ裸眼３Dシミュレーション</h1>
  </header>

  <div class="stage" id="stage">
  </div>

  <div class="controls">
    <div class="group">
      <span class="glabel">視点</span>
      <div class="seg" id="views">
        <button data-view="sweet" aria-pressed="true">スイートスポット</button>
        <button data-view="front">A/C面の正面</button>
        <button data-view="side">B/D面の正面</button>
        <button data-view="opposite">反対の角</button>
        <button data-view="top">上から俯瞰</button>
      </div>
    </div>
    <div class="group">
      <span class="glabel">狙う角</span>
      <div class="seg" id="corners">
        <button data-c="1" aria-pressed="true">A×D（交差点側）</button>
        <button data-c="0">A×B</button>
        <button data-c="3">B×C</button>
        <button data-c="2">C×D</button>
      </div>
    </div>
    <div class="group">
      <span class="glabel">コンテンツ</span>
      <div class="seg" id="modes">
        <button data-m="ship" aria-pressed="true">宇宙船演出</button>
        <button data-m="pop">飛び出し演出</button>
        <button data-m="tank">水槽演出</button>
      </div>
    </div>
    <div class="group">
      <span class="glabel">背景</span>
      <div class="seg" id="bgSel">
        <button data-bg="dark">黒</button>
        <button data-bg="city" aria-pressed="true">街</button>
      </div>
    </div>
    <div class="group">
      <span class="glabel">表示</span>
      <div class="seg">
        <button class="toggle" id="animToggle" aria-pressed="true">再生</button>
      </div>
    </div>
  </div>

  <fieldset class="dims" id="pos">
    <legend class="glabel">設置位置（mm）</legend>
    <label>国道9号側（D面方向）へ<input type="number" id="pPX" data-k="PX" min="-40000" max="40000" step="500"></label>
    <label>やまびこ道路側（A面方向）へ<input type="number" id="pPZ" data-k="PZ" min="-40000" max="40000" step="500"></label>
    <button class="toggle" id="posReset" type="button">初期位置に戻す</button>
    <p class="srcinfo poshint">街の中でサイネージを動かします。マイナスの値で反対方向へ動きます。視点の位置はサイネージと一緒に動きます。</p>
  </fieldset>

  <fieldset class="dims" id="dims">
    <legend class="glabel">寸法（mm）</legend>
    <label>長辺<input type="number" id="dW" data-k="W" min="1000" max="15000" step="10"></label>
    <label>短辺<input type="number" id="dD" data-k="D" min="1000" max="15000" step="10"></label>
    <label>角R<input type="number" id="dR" data-k="R" min="0" max="7500" step="10"></label>
    <label>画面高さ<input type="number" id="dH" data-k="H" min="500" max="10000" step="10"></label>
    <label>支柱の高さ<input type="number" id="dLH" data-k="LH" min="100" max="5000" step="10"></label>
    <label>支柱の直径<input type="number" id="dLD" data-k="LD" min="50" max="1500" step="1"></label>
    <label>支柱間隔（長辺方向）<input type="number" id="dLX" data-k="LX" min="0" max="15000" step="10"></label>
    <label>支柱間隔（短辺方向）<input type="number" id="dLZ" data-k="LZ" min="0" max="15000" step="10"></label>
    <label>視点距離（角から）<input type="number" id="dDIST" data-k="DIST" min="2000" max="30000" step="100"></label>
    <button class="toggle" id="dimReset" type="button">初期値に戻す</button>
  </fieldset>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
// 初期値: 長辺は平面図 S長野 パターン① の5,040。短辺2,880・角R800・支柱 H880 φ426 は指定値。画面高は960×3段
const DEF={W:5040,D:2880,R:800,H:2880,LH:880,LD:426,LX:4000,LZ:1980,DIST:7500,PX:0,PZ:0};
let P=Object.assign({},DEF);
const EYE=1.6;
let W,D,R,Y0,Y1,sx,sz,segs,PER,IX,IZ,roomH,roomY;
const LOOK=new THREE.Vector3();
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);

/* ---------- dimensions & rounded-rect perimeter ---------- */
function setDims(){
  W=P.W/1000; D=P.D/1000;
  R=Math.max(0.005,Math.min(P.R/1000,Math.min(W,D)/2-0.005));
  Y0=P.LH/1000; Y1=Y0+P.H/1000;
  sx=W/2-R; sz=D/2-R;
  segs=[
    {len:2*sz, f:t=>[W/2, -sz+t, 1,0]},
    {len:Math.PI*R/2, f:t=>{const a=t/R;return [sx+R*Math.cos(a), sz+R*Math.sin(a), Math.cos(a), Math.sin(a)]}},
    {len:2*sx, f:t=>[sx-t, D/2, 0,1]},
    {len:Math.PI*R/2, f:t=>{const a=Math.PI/2+t/R;return [-sx+R*Math.cos(a), sz+R*Math.sin(a), Math.cos(a), Math.sin(a)]}},
    {len:2*sz, f:t=>[-W/2, sz-t, -1,0]},
    {len:Math.PI*R/2, f:t=>{const a=Math.PI+t/R;return [-sx+R*Math.cos(a), -sz+R*Math.sin(a), Math.cos(a), Math.sin(a)]}},
    {len:2*sx, f:t=>[-sx+t, -D/2, 0,-1]},
    {len:Math.PI*R/2, f:t=>{const a=1.5*Math.PI+t/R;return [sx+R*Math.cos(a), -sz+R*Math.sin(a), Math.cos(a), Math.sin(a)]}},
  ];
  PER=segs.reduce((s,g)=>s+g.len,0);
  const inset=Math.max(0.15,R*0.3+0.06); // 仮想の部屋の角を、丸い画面の角より奥に置く
  IX=Math.max(0.2,W/2-inset); IZ=Math.max(0.2,D/2-inset);
  roomH=Y1-Y0; roomY=(Y0+Y1)/2;
  LOOK.set(0,roomY,0);
}
function at(s){ s=((s%PER)+PER)%PER; for(const g of segs){ if(s<=g.len) return g.f(s); s-=g.len;} return segs[0].f(0); }

function shellGeometry(n){
  const pos=[],nor=[],arc=[],idx=[];
  for(let i=0;i<=n;i++){
    const sv=PER*i/n, p=at(sv);
    pos.push(p[0],Y0,p[1], p[0],Y1,p[1]);
    nor.push(p[2],0,p[3], p[2],0,p[3]);
    arc.push(sv,sv);
  }
  for(let i=0;i<n;i++){
    const a=2*i,b=2*(i+1),c=2*i+1,d=2*(i+1)+1;
    idx.push(a,c,b, b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('arc',new THREE.Float32BufferAttribute(arc,1));
  g.setIndex(idx);
  return g;
}
function rrShape(w,d,r){
  r=Math.max(0.001,Math.min(r,w/2-0.001,d/2-0.001));
  const s=new THREE.Shape(), x=w/2, z=d/2;
  s.moveTo(-x+r,-z); s.lineTo(x-r,-z); s.quadraticCurveTo(x,-z,x,-z+r);
  s.lineTo(x,z-r); s.quadraticCurveTo(x,z,x-r,z); s.lineTo(-x+r,z);
  s.quadraticCurveTo(-x,z,-x,z-r); s.lineTo(-x,-z+r); s.quadraticCurveTo(-x,-z,-x+r,-z);
  return s;
}
function disposeGroup(g){ g.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); g.clear(); }

/* ---------- corners / sweet spot ---------- */
const CORNERS=[[1,1],[-1,1],[-1,-1],[1,-1]];
let cornerIdx=1; // CORNERS: 0=A×B 1=A×D 2=C×D 3=B×C（A面=+z, B面=+x）
function cornerPoint(c){ const k=Math.SQRT1_2; return new THREE.Vector3(c[0]*(sx+R*k),0,c[1]*(sz+R*k)); }
function sweetPos(c){ const p=cornerPoint(c); const dir=new THREE.Vector3(c[0],0,c[1]).normalize(); return p.addScaledVector(dir,P.DIST/1000).setY(EYE); }

/* ---------- content scene (what the LED shows) ---------- */
const content=new THREE.Scene();
content.background=new THREE.Color(0x0b0f1a);
const sweetCam=new THREE.PerspectiveCamera(50,1,0.05,80);
const rt=new THREE.WebGLRenderTarget(2048,2048,{samples:4});
rt.texture.generateMipmaps=false; rt.texture.minFilter=THREE.LinearFilter;

content.add(new THREE.AmbientLight(0xffffff,0.35));
const keyLight=new THREE.DirectionalLight(0xffffff,0.9); content.add(keyLight);
const inLight=new THREE.PointLight(0xffffff,1.1,9); content.add(inLight);

function gridTex(bg,line,n){
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d');
  g.fillStyle=bg; g.fillRect(0,0,512,512); g.strokeStyle=line; g.lineWidth=3;
  for(let i=0;i<=n;i++){ const v=i*512/n; g.beginPath(); g.moveTo(v,0); g.lineTo(v,512); g.stroke(); g.beginPath(); g.moveTo(0,v); g.lineTo(512,v); g.stroke(); }
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}

/* pop-out mode: static room is rebuilt on resize, moving parts are kept */
const pop=new THREE.Group(); content.add(pop);
const popRoom=new THREE.Group(); pop.add(popRoom);
const popWallMat=new THREE.MeshStandardMaterial({color:0x1d2540,roughness:.9,side:THREE.BackSide});
const fl=gridTex('#121a30','#2f6fa8',8);
const floorMat=new THREE.MeshStandardMaterial({map:fl,roughness:.8});
const edgeMat=new THREE.MeshBasicMaterial({color:0x56d6ff});
const hero=new THREE.Mesh(new THREE.TorusKnotGeometry(0.42,0.14,180,24),
  new THREE.MeshStandardMaterial({color:0xff9a3c,metalness:.35,roughness:.3,emissive:0x331400}));
pop.add(hero);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.55,40),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.5}));
shadow.rotation.x=-Math.PI/2; pop.add(shadow);
const cubes=[]; for(let i=0;i<12;i++){ const m=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.16),
  new THREE.MeshStandardMaterial({color:i%2?0x8f8cff:0x56d6ff,emissive:i%2?0x1a1850:0x0a2a35,roughness:.4})); m.userData={a:i/12*Math.PI*2,hf:0.2+((i*37)%10)/10*0.65,r:0.9+(i%3)*0.35}; cubes.push(m); pop.add(m); }

/* tank mode */
const tank=new THREE.Group(); tank.visible=false; content.add(tank);
const tankRoom=new THREE.Group(); tank.add(tankRoom);
const tankWallMat=new THREE.MeshStandardMaterial({color:0x0e5a7a,roughness:1,side:THREE.BackSide});
const sandMat=new THREE.MeshStandardMaterial({color:0xc7ab7a,roughness:1});
const rockMat=new THREE.MeshStandardMaterial({color:0x6b6f62,roughness:1});
const weedMat=new THREE.MeshStandardMaterial({color:0x2f9a5a,roughness:.9});
const surfMat=new THREE.MeshStandardMaterial({color:0x9fe6ff,transparent:true,opacity:.35,side:THREE.DoubleSide,roughness:.2});
let weeds=[], surf=null;
const fishes=[];
const fishCols=[0xffb347,0xff6b6b,0xffe066,0x7fd1ff,0xf8f8f8,0xff8fd0];
for(let i=0;i<16;i++){
  const g=new THREE.Group(); const col=fishCols[i%fishCols.length];
  const mat=new THREE.MeshStandardMaterial({color:col,roughness:.45,emissive:new THREE.Color(col).multiplyScalar(.12)});
  const body=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),mat); body.scale.set(.07,.12,.3); g.add(body);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(.12,.2,4),mat); tail.rotation.x=Math.PI/2; tail.scale.set(.25,1,1); tail.position.z=-.36; g.add(tail);
  if(i===0) g.scale.setScalar(2.4);
  g.userData={near:i<9, fa:((i*13)%10)/10, fb:((i*7)%10)/10, hf:0.2+((i*41)%10)/10*0.65, w:(i%2?1:-1)*(0.18+((i*17)%10)/60), ph:i*1.3, tail};
  fishes.push(g); tank.add(g);
}
const bubbles=[]; for(let i=0;i<40;i++){ const b=new THREE.Mesh(new THREE.SphereGeometry(.025+(i%3)*.012,8,6),new THREE.MeshStandardMaterial({color:0xe8fbff,transparent:true,opacity:.7}));
  b.userData={fx:((i*23)%8)/7, fz:((i*11)%5)/4, o:i/40}; bubbles.push(b); tank.add(b); }

/* ---------- 宇宙船演出: 宇宙空間から光をまとって飛び出す宇宙船 ---------- */
const ship=new THREE.Group(); ship.visible=false; content.add(ship);
const shipRoom=new THREE.Group(); ship.add(shipRoom);
function radialTex(stops){ return canvasTexC(256,256,(g,w,h)=>{ const gr=g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2); stops.forEach(([o,c])=>gr.addColorStop(o,c)); g.fillStyle=gr; g.fillRect(0,0,w,h); }); }
function canvasTexC(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return new THREE.CanvasTexture(c); }
const glowTex=radialTex([[0,'rgba(255,255,255,1)'],[0.15,'rgba(170,230,255,0.9)'],[0.45,'rgba(60,150,255,0.35)'],[1,'rgba(0,40,120,0)']]);
const nebTex=radialTex([[0,'rgba(90,170,255,0.55)'],[0.5,'rgba(40,90,200,0.22)'],[1,'rgba(10,20,60,0)']]);
const rayTex=canvasTexC(512,512,(g,w,h)=>{ g.translate(w/2,h/2);
  for(let i=0;i<140;i++){ const a=Math.random()*Math.PI*2, len=120+Math.random()*130, wd=0.4+Math.random()*2.2;
    const gr=g.createLinearGradient(0,0,Math.cos(a)*len,Math.sin(a)*len); gr.addColorStop(0,'rgba(220,245,255,0.9)'); gr.addColorStop(1,'rgba(80,170,255,0)');
    g.strokeStyle=gr; g.lineWidth=wd; g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(a)*len,Math.sin(a)*len); g.stroke(); }
  const c=g.createRadialGradient(0,0,0,0,0,90); c.addColorStop(0,'rgba(255,255,255,1)'); c.addColorStop(1,'rgba(120,200,255,0)'); g.fillStyle=c; g.fillRect(-90,-90,180,180); });
const addMat=(map,color,op)=>new THREE.SpriteMaterial({map,color,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false});

const screenMat=new THREE.ShaderMaterial({
  uniforms:{tex:{value:rt.texture},vp:{value:new THREE.Matrix4()},eye:{value:new THREE.Vector3()},away:{value:0.55},
    unwrap:{value:0},sA:{value:0},per:{value:1},y0:{value:0},y1:{value:1}},
  vertexShader:`attribute float arc; varying vec3 vW; varying vec3 vN; varying float vS;
    void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; vN=normal; vS=arc; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`uniform sampler2D tex; uniform mat4 vp; uniform vec3 eye; uniform float away;
    uniform float unwrap; uniform float sA; uniform float per; uniform float y0; uniform float y1;
    varying vec3 vW; varying vec3 vN; varying float vS;
    void main(){
      vec3 col;
      if(unwrap>0.5){
        // 展開図: 左端=A面の左端、左から A→B→C→D 面（各面の右隣の角Rを含む）
        float u=mod(sA-vS,per)/per;
        float v=(vW.y-y0)/(y1-y0);
        col=texture2D(tex,vec2(u,v)).rgb;
      } else {
        vec4 c=vp*vec4(vW,1.0); vec2 uv=c.xy/c.w*0.5+0.5;
        col=texture2D(tex,uv).rgb*1.12;
        float facing=dot(normalize(vN),normalize(eye-vW));
        col*=mix(away,1.0,smoothstep(-0.05,0.05,facing));
      }
      gl_FragColor=vec4(col,1.0);
    }`
});

function makeHuman(o){
  const g=new THREE.Group(), k=o.h/1.72;
  const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.75});
  const skin=M(0xe0b394), hairM=M(o.hair), top=M(o.top), bottom=M(o.bottom), shoe=M(0x2a2a2a);
  const add=(geo,mat,x,y,z,rx=0,rz=0)=>{ const m=new THREE.Mesh(geo,mat); m.position.set(x*k,y*k,z*k); m.rotation.set(rx,0,rz); m.castShadow=true; g.add(m); return m; };
  // 脚と靴
  for(const sx of [-1,1]){
    if(o.skirt){ add(new THREE.CapsuleGeometry(0.055*k,0.62*k,4,10),skin,sx*0.08,0.42,0); }
    else add(new THREE.CapsuleGeometry(0.075*k,0.66*k,4,10),bottom,sx*0.095,0.47,0);
    add(new THREE.BoxGeometry(0.11*k,0.07*k,0.26*k),shoe,sx*(o.skirt?0.08:0.095),0.035,0.04);
  }
  if(o.skirt) add(new THREE.CylinderGeometry(0.17*k,0.27*k,0.5*k,20),bottom,0,0.78,0);
  // 胴体・腕
  const torso=add(new THREE.CapsuleGeometry(o.skirt?0.15*k:0.17*k,0.42*k,6,14),top,0,1.2,0); torso.scale.z=0.62;
  for(const sx of [-1,1]){ add(new THREE.CapsuleGeometry(0.052*k,0.52*k,4,10),top,sx*(o.skirt?0.2:0.235),1.13,0,0,sx*0.08);
    add(new THREE.SphereGeometry(0.05*k,10,8),skin,sx*(o.skirt?0.225:0.26),0.8,0); }
  // 首・頭・髪
  add(new THREE.CylinderGeometry(0.05*k,0.055*k,0.1*k,12),skin,0,1.49,0);
  const head=add(new THREE.SphereGeometry(0.105*k,20,16),skin,0,1.61,0.005); head.scale.set(0.92,1.08,1);
  const hair=add(new THREE.SphereGeometry(0.112*k,20,14,0,Math.PI*2,0,Math.PI*0.55),hairM,0,1.625,-0.008); hair.scale.set(0.95,1.08,1.02);
  if(o.longHair){ const back=add(new THREE.CapsuleGeometry(0.1*k,0.22*k,4,12),hairM,0,1.47,-0.06); back.scale.set(1.05,1,0.55); }
  if(o.bag){ add(new THREE.BoxGeometry(0.06*k,0.24*k,0.3*k),M(0x7a4b2a),0.26,0.95,0.02); }
  return g;
}

function scaledBox(w,h,d,bay,floor){
  const geo=new THREE.BoxGeometry(w,h,d), uv=geo.attributes.uv;
  for(let f=0;f<6;f++) for(let k=0;k<4;k++){ const i=f*4+k; const span=f<2?d:(f<4?0:w);
    uv.setXY(i, f>=2&&f<4?0:uv.getX(i)*span/(bay*4), f>=2&&f<4?0:uv.getY(i)*h/(floor*4)); }
  return geo;
}

}

function updateTraffic(dt,t){
  if(!cityGroup.visible) return;
  const st=signalState(t);
  for(const grp of ['K','Y']){ const s=st[grp], ped=(st[grp==='K'?'Y':'K']==='r'&&s==='g')||false;
    sigLamps[grp].forEach(l=>{ if(l.g){ l.g.material=s==='g'?sigMat.g:sigMat.off; l.y.material=s==='y'?sigMat.y:sigMat.off; l.r.material=s==='r'?sigMat.r:sigMat.off; }
      else { // 歩行者用は、横切る道路の車が赤のときに青
        const walk=st[grp==='K'?'Y':'K']==='g'?false:(s==='g'); l.pedG.material=walk?sigMat.g:sigMat.off; l.pedR.material=walk?sigMat.off:sigMat.r; } }); }
  const VMAX=10;
  lanes.forEach(ln=>{ const sig=st[ln.grp];
    const cars=ln.cars.slice().sort((a,b)=>a.userData.s-b.userData.s);
    cars.forEach((c,i)=>{ const u=c.userData; const lead=cars[(i+1)%cars.length].userData; let ls=lead.s; if(ls<=u.s) ls+=240;
      let limit=ls-7.2; const front=u.s+2.4;
      if(sig!=='g' && front<ln.stop+0.3 && front>ln.stop-50 && (sig==='r'||ln.stop-front>6||u.v<2)) limit=Math.min(limit,ln.stop-2.4);
      const target=Math.max(0,Math.min(VMAX,(limit-u.s)*0.8));
      u.v+=THREE.MathUtils.clamp(target-u.v,-7*dt,2.5*dt); u.v=Math.max(0,u.v);
      u.s=Math.min(u.s+u.v*dt,Math.max(u.s,limit));
    });
    ln.cars.forEach(c=>{ if(c.userData.s>120) c.userData.s-=240; });
  });
  placeCars();
}

inset.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),insetMat));

/* ---------- 元映像の差し替え ---------- */
const src={tex:null,map:'unwrap',aspect:1,url:null,video:null,name:''};
const srcInfo=document.getElementById('srcInfo'), srcGuide=document.getElementById('srcGuide');
function fmt(v){ return Math.round(v).toLocaleString('en-US'); }
function updateSrcGuide(){} /* 元映像の差し替え機能は外した */
function applySource(){
  // 貼り方の切り替えは、読み込んだファイルにだけ効く（サンプル映像は自動で作っているため）
  document.querySelectorAll('#srcMap button').forEach(b=>{ b.disabled=!src.tex; });
  const U=screenMat.uniforms;
  if(src.tex){ U.tex.value=src.tex; U.unwrap.value=src.map==='unwrap'?1:0; insetMat.map=src.tex; }
  else { U.tex.value=rt.texture; U.unwrap.value=0; insetMat.map=rt.texture; }
  insetMat.needsUpdate=true;
  insetLabel.textContent=!src.tex?'スイートスポットから描いた元映像':(src.map==='unwrap'?'読み込んだ展開図':'読み込んだ元映像');
  placeSweetCam(); resize();
}
function clearSource(){
  if(src.video){ src.video.pause(); src.video.removeAttribute('src'); src.video.load(); }
  if(src.tex) src.tex.dispose();
  if(src.url) URL.revokeObjectURL(src.url);
  src.tex=null; src.video=null; src.url=null; src.aspect=1; src.name='';
}
function loadFile(file){
  if(!file) return;
  const isVideo=file.type.startsWith('video/'), isImage=file.type.startsWith('image/');
  if(!isVideo&&!isImage){ srcInfo.textContent='読み込めませんでした。画像（JPG・PNGなど）か動画（MP4など）を選んでください。'; return; }
  clearSource();
  const url=URL.createObjectURL(file);
  const done=(tex,w,h)=>{ src.tex=tex; src.url=url; src.aspect=w/h; src.name=file.name;
    tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false; tex.wrapS=THREE.RepeatWrapping;
    srcInfo.innerHTML='読み込み中：<b>'+file.name.replace(/[<>&]/g,'')+'</b>（'+w+' × '+h+' px）';
    applySource(); };
  const fail=()=>{ URL.revokeObjectURL(url); srcInfo.textContent='このファイルは読み込めませんでした。別の形式で書き出したファイルを試してください。'; };
  if(isImage){
    const img=new Image();
    img.onload=()=>{ const t=new THREE.Texture(img); t.needsUpdate=true; done(t,img.naturalWidth,img.naturalHeight); };
    img.onerror=fail; img.src=url;
  } else {
    const v=document.createElement('video');
    v.muted=true; v.loop=true; v.playsInline=true; v.crossOrigin='anonymous';
    v.onloadeddata=()=>{ src.video=v; v.play().catch(()=>{}); done(new THREE.VideoTexture(v),v.videoWidth,v.videoHeight); };
    v.onerror=fail; v.src=url; v.load();
  }
}


function viewPreset(name){
  const c=CORNERS[cornerIdx];
  // 目線の高さの視点は、注視点を目線より少し上に置く（下からの見上げで回転制限にかからないように）
  const eyeT=new THREE.Vector3(0,EYE+0.4,0);
  if(name==='sweet') return [sweetPos(c),eyeT.clone()];
  const fd=Math.max(11,P.DIST/1000+Math.max(W,D)/2+2);
  if(name==='front') return [new THREE.Vector3(0,EYE,c[1]*fd),eyeT.clone()];
  if(name==='side') return [new THREE.Vector3(c[0]*fd,EYE,0),eyeT.clone()];
  if(name==='opposite'){ const p=sweetPos([-c[0],-c[1]]); return [p,eyeT.clone()]; }
  return [new THREE.Vector3(c[0]*(W/2+4.5),Y1+7.5,c[1]*(D/2+6)),new THREE.Vector3(0,Y0+roomH*0.4,0)];
}
let tween=null, currentView='sweet';
function goTo(name){
  currentView=name;
  const [p,t]=viewPreset(name);
  if(reduceMotion){ cam.position.copy(p); controls.target.copy(t); tween=null; return; }
  tween={p0:cam.position.clone(),t0:controls.target.clone(),p1:p,t1:t,s:performance.now(),d:1300};
}

/* ---------- UI ---------- */
function press(groupId,btn){ document.querySelectorAll('#'+groupId+' button').forEach(b=>b.setAttribute('aria-pressed',b===btn?'true':'false')); }
document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{press('views',b);goTo(b.dataset.view);}));
document.querySelectorAll('#corners button').forEach(b=>b.addEventListener('click',()=>{press('corners',b);cornerIdx=+b.dataset.c;placeSweetCam();goTo(currentView);}));
document.querySelectorAll('#bgSel button').forEach(b=>b.addEventListener('click',()=>{press('bgSel',b);bgMode=b.dataset.bg;applyBg();}));
document.querySelectorAll('#modes button').forEach(b=>b.addEventListener('click',()=>{press('modes',b);mode=b.dataset.m;applyMode();}));
let showInset=false, playing=true; /* 元映像の小窓は表示しない */
const insetLabel={style:{},textContent:''};
const animToggle=document.getElementById('animToggle');
animToggle.addEventListener('click',()=>{playing=!playing;animToggle.setAttribute('aria-pressed',playing);animToggle.textContent=playing?'再生':'一時停止';});
controls.addEventListener('start',()=>{ tween=null; document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed','false')); });

let insetW=200, insetH=200;
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
  const a=(typeof src!=='undefined'&&src.tex)?src.aspect:1;
  insetW=Math.round(Math.min(a>=1?Math.min(220*a,w*0.5):220*a,w*0.5)); insetH=Math.round(insetW/a);
  if(insetH>Math.min(220,h*0.36)){ insetH=Math.round(Math.min(220,h*0.36)); insetW=Math.round(insetH*a); }
  insetLabel.style.bottom=(12+insetH+6)+'px';
}
new ResizeObserver(resize).observe(stage);

const dot=document.getElementById('dot'), stText=document.getElementById('statusText'), distEl=document.getElementById('dist');
let lastState='';
function updateStatus(){} /* 状態表示（立体に見える／視点のずれ）は外した */

/* ---------- animation ---------- */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let simT=0, trafficT=0, last=performance.now();
const tmp=new THREE.Vector3();
function animateContent(t){
  const c=CORNERS[cornerIdx];
  if(mode==='pop'){
    const home=new THREE.Vector3(0,roomY,0);
    const dir=new THREE.Vector3(c[0],0,c[1]).normalize();
    const out=cornerPoint(c).addScaledVector(dir,1.05).setY(roomY+0.1);
    const k=t%11; let f=0;
    if(k<3.5) f=0; else if(k<5) f=ease((k-3.5)/1.5); else if(k<7.5) f=1; else if(k<9) f=1-ease((k-7.5)/1.5); else f=0;
    hero.position.lerpVectors(home,out,f); hero.position.y+=Math.sin(t*1.7)*0.08;
    hero.rotation.set(t*0.6,t*0.9,0);
    shadow.position.x=THREE.MathUtils.clamp(hero.position.x,-IX+.4,IX-.4);
    shadow.position.z=THREE.MathUtils.clamp(hero.position.z,-IZ+.4,IZ-.4);
    shadow.material.opacity=0.5*(1-f*0.6);
    cubes.forEach((m,i)=>{ const u=m.userData, a=u.a+t*0.35*(i%2?1:-1);
      m.position.set(Math.cos(a)*u.r/1.6*(IX-0.3),Y0+u.hf*roomH+Math.sin(t+i)*0.12,Math.sin(a)*u.r/1.6*(IZ-0.25)); m.rotation.set(t+i,t*1.3,0); });
  } else if(mode==='ship'){
    // 経路: 宇宙の奥 → 箱の中 → 角から手前へ飛び出してホバリング → 上へ抜ける（12秒で1周）
    const E=sweetCam.position, toCam=tmp.copy(E).sub(LOOK).setY(0).normalize().clone();
    const side=new THREE.Vector3(-toCam.z,0,toCam.x);
    const P0=LOOK.clone().addScaledVector(toCam,-16).add(new THREE.Vector3(0,1.6,0)).addScaledVector(side,-2.5);
    const P1=LOOK.clone().addScaledVector(toCam,-1.2).add(new THREE.Vector3(0,0.15,0));
    const P2=cornerPoint(c).addScaledVector(toCam,1.1).setY(roomY+0.25);
    const P3=P2.clone().add(new THREE.Vector3(0,6,0)).addScaledVector(side,4).addScaledVector(toCam,2);
    const k=t%12; let pos=new THREE.Vector3(), look=new THREE.Vector3(), sc=1, roll=0;
    const sClamp=0.82*Math.min(1.15,Math.max(0.45,Math.min(roomH/2.88,IZ/1.14)));
    if(k<2){ const f=ease(k/2); pos.lerpVectors(P0,P0.clone().lerp(P1,0.15),f); look.copy(P1); sc=0.15+0.85*f; }
    else if(k<5.5){ const f=ease((k-2)/3.5); pos.lerpVectors(P0.clone().lerp(P1,0.15),P1,f); look.copy(P2); roll=Math.sin(f*Math.PI)*0.5; }
    else if(k<7.5){ const f=ease((k-5.5)/2); pos.lerpVectors(P1,P2,f); look.copy(P2).addScaledVector(toCam,3).addScaledVector(side,2.2); roll=-Math.sin(f*Math.PI)*0.35; }
    else if(k<10){ const f=(k-7.5)/2.5; pos.copy(P2).add(new THREE.Vector3(Math.sin(f*6)*0.05,Math.sin(f*Math.PI*2)*0.08,0)); look.copy(P2).addScaledVector(toCam,3).addScaledVector(side,2.2).add(new THREE.Vector3(0,0.2,0)); roll=-0.25+Math.sin(f*Math.PI*2)*0.08; }
    else { const f=ease((k-10)/2); pos.lerpVectors(P2,P3,f); look.copy(P3).add(new THREE.Vector3(0,3,0)); roll=f*0.8; }
    craft.position.copy(pos); craft.lookAt(look); craft.rotateZ(roll); craft.scale.setScalar(sc*sClamp);
    craft.visible=!(k>11.6);
    // 光の爆発（出現時に強く）
    const flash=k<2.5?Math.max(0,1-Math.abs(k-0.8)/1.7):0.25+0.05*Math.sin(t*3);
    burst.position.copy(P0).addScaledVector(toCam,-1.5); burst.scale.setScalar(10+flash*14); burst.material.opacity=0.35+flash*0.65; burst.material.rotation=t*0.05;
    burstCore.position.copy(burst.position); burstCore.scale.setScalar(4+flash*9); burstCore.material.opacity=0.5+flash*0.5;
    shipLight.position.copy(P0); shipLight.intensity=1.2+flash*3;
    shipFill.position.copy(E).add(new THREE.Vector3(0,3,0)).addScaledVector(side,-3); shipFill.target.position.copy(LOOK);
    engineSprites.forEach((s,i)=>{ s.material.opacity=0.75+0.25*Math.sin(t*20+i); });
    nebulae.forEach((s,i)=>{ s.position.copy(LOOK).addScaledVector(toCam,-(18+i*4)).addScaledVector(side,(i-2)*5).add(new THREE.Vector3(0,(i%2?3:-1),0)); s.scale.setScalar(16+i*3); });
    // 光の筋: 奥から手前へ流れる
    const axis=tmp.copy(P1).sub(P0).normalize().clone(), up=new THREE.Vector3(0,1,0), sd=new THREE.Vector3().crossVectors(axis,up).normalize();
    const arr=streakGeo.attributes.position.array, speed=k<7.5?1:0.35;
    streakSeed.forEach((s,i)=>{ const u=(s.o+t*0.35*speed)%1, along=-4+u*20, base=P0.clone().addScaledVector(axis,along).addScaledVector(sd,Math.cos(s.a)*s.r).addScaledVector(up,Math.sin(s.a)*s.r);
      const end=base.clone().addScaledVector(axis,s.len*(0.6+speed));
      arr.set([base.x,base.y,base.z,end.x,end.y,end.z],i*6); });
    streakGeo.attributes.position.needsUpdate=true;
    streaks.material.opacity=0.35+0.4*speed;
  } else {
    fishes.forEach(g=>{ const u=g.userData, a=u.ph+t*u.w;
      g.position.set(Math.cos(a)*u.a, u.h+Math.sin(t*0.7+u.ph)*0.12, Math.sin(a)*u.b);
      const a2=a+0.05*Math.sign(u.w); tmp.set(Math.cos(a2)*u.a, g.position.y, Math.sin(a2)*u.b); g.lookAt(tmp);
      u.tail.rotation.y=Math.sin(t*9+u.ph)*0.45; });
    bubbles.forEach(b=>{ const u=b.userData, k=(t*0.18+u.o)%1; b.position.set((u.fx*2-1)*Math.max(0.05,IX-0.4)+Math.sin(t*2+u.o*9)*0.04,Y0+0.1+k*Math.max(0.1,roomH-0.3),(u.fz*2-1)*Math.max(0.05,IZ-0.4)); });
    weeds.forEach(m=>{ m.rotation.z=Math.sin(t*1.2+m.userData.p)*0.12; });
    const pa=surf.geometry.attributes.position;
    for(let i=0;i<pa.count;i++){ const x=pa.getX(i), y=pa.getY(i); pa.setZ(i,Math.sin(x*2.2+t*1.6)*0.03+Math.cos(y*3+t*1.1)*0.025); }
    pa.needsUpdate=true;
  }
}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(playing) simT+=dt;
  animateContent(simT);
  if(playing) trafficT+=dt; updateTraffic(playing?dt:0,trafficT);
  if(tween){ const k=Math.min(1,(now-tween.s)/tween.d), e=ease(k);
    cam.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.t0,tween.t1,e); if(k>=1) tween=null; }
  controls.update();
  { const u=screenMat.uniforms.away, goal=currentView==='opposite'?0.9:0.55; u.value+= (goal-u.value)*Math.min(1,dt*4); }
  person.visible=cam.position.distanceTo(sweetCam.position)>1.2;
  updateStatus();

  renderer.setScissorTest(false);
  if(!src.tex){ renderer.setRenderTarget(rt); renderer.render(content,sweetCam); }
  renderer.setRenderTarget(null);
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setViewport(0,0,w,h); renderer.render(world,cam);
  if(showInset){ renderer.setScissorTest(true); renderer.setScissor(w-insetW-12,12,insetW,insetH);
    renderer.setViewport(w-insetW-12,12,insetW,insetH); renderer.render(inset,insetCam); renderer.setScissorTest(false); }
  requestAnimationFrame(frame);
}

const dimInputs=[...document.querySelectorAll('#dims input, #pos input')];
function fillInputs(){ dimInputs.forEach(i=>{ i.value=P[i.dataset.k]; }); }
let dimTimer=null;
function readInputs(){
  dimInputs.forEach(i=>{ const v=parseFloat(i.value); if(!isFinite(v)) return;
    P[i.dataset.k]=Math.min(+i.max,Math.max(+i.min,v)); });
  rebuild(); goTo(currentView);
}
dimInputs.forEach(i=>{
  i.addEventListener('input',()=>{ clearTimeout(dimTimer); dimTimer=setTimeout(readInputs,350); });
  i.addEventListener('change',()=>{ clearTimeout(dimTimer); readInputs(); fillInputs(); });
});
document.getElementById('dimReset').addEventListener('click',()=>{ const px=P.PX,pz=P.PZ; P=Object.assign({},DEF,{PX:px,PZ:pz}); fillInputs(); rebuild(); goTo(currentView); });
document.getElementById('posReset').addEventListener('click',()=>{ P.PX=0; P.PZ=0; fillInputs(); rebuild(); goTo(currentView); });
fillInputs();
rebuild(); applyBg(); resize(); document.querySelectorAll('#srcMap button').forEach(b=>{ b.disabled=true; });
const [p0,t0]=viewPreset('sweet'); cam.position.copy(p0); controls.target.copy(t0);
requestAnimationFrame(frame);
})();
</script>
